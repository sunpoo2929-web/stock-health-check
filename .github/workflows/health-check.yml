name: 7 PM Stock Health Check

on:
  schedule:
    # 12:00 UTC = 19:00 เวลาไทย จันทร์–ศุกร์ (วันหยุดตลาด สคริปต์ตรวจเองแล้วข้าม)
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write              # ให้บันทึก docs/data.json กลับเข้า repo (Dashboard อัปเดต)

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run health check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # กดรันเอง = ไม่รอ และใช้ราคาปิดล่าสุดที่มี (ทดสอบได้แม้วันหยุด)
          MAX_WAIT_MIN: ${{ github.event_name == 'workflow_dispatch' && '0' || '40' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python stock_health_check.py

      - name: Save dashboard data
        run: |
          git config user.name  "health-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Bangkok date +'%Y-%m-%d %H:%M')"
          git push
